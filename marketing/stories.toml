road_cost = 4.0
# The spot that carries the pinned photo. photo_file, a path under the gitignored
# marketing/photos/, makes it a real photograph; without it the farm pins a gradient.
photo_at = "Mount Tallac"
look = {}

[[tahoe_ca.sections]]
heading = "The lake shades deeper away from shore"
crop_center_m = [757310, 4317644]
crop_in = [9, 6.75]
feature = "Water"
variant = "poster"
