# The five showcase plates and their stories, one table per plate, in page order
# (spec docs/superpowers/specs/2026-11-01-showcase-plates-and-pick-a-plate-landing-design.md,
# section 8). Headings match the copy document, and tests/test_stories_config.py holds
# them together.
#
# status = "ready": scripts/story_config.py reads this file for the asset farm's
# _demo_journeys and for scripts/track_straightness.py. Each plate's destinations,
# trips and road_cost set its demo trips (scripts/track_network.py). A destination or
# road name is looked up in the plate's labels.json, hydro.json or network cache, and a
# name that does not resolve fails that run. In `trips`, a drive runs exactly as many
# times as it is listed, and the other shapes cycle over the slots left.
#
# A section that crops (variant "poster" or "poster_journey") gives its window as
# crop_in = [width, height] in printed inches plus crop_center_m = [x, y] in CRS metres,
# or crop_anchor = "profile" (centred on the elevation strip, which sits above the
# cartouche and compass, not in the corner; crop_in must hold the whole strip) in place
# of the centre. A `film` or `editions` section needs none. The farm's `stories`
# tier fails a plate, naming the section's heading, while a window is missing. `look`
# holds spec fields that tune the plate's look over the customer's (ORDER_LOOK). A
# plate that shows a Journey Light pair adds journey = { sun_azimuth_deg = ...,
# sun_altitude_deg = ..., golden_strength = ... }.

status = "ready"

[canyonlands_ut]
anchor = "canyonlands"
name = "Canyonlands and Moab"
eyebrow = "Cliffs and canyons"
# Checked against the fetched network 2026-11-01: labels.json holds no "Island in the Sky"
# or "The Confluence", and its "The Needles" summit sits 50 km north of the Needles district.
# The Neck is the gap at the mesa's gate, Elephant Hill the Needles district trailhead and
# Lizard Rock the nearest named summit to the Confluence.
destinations = ["The Neck", "Elephant Hill", "Lizard Rock"]
trips = [
    { shape = "drive", road = "White Rim Road" },
    { shape = "out_and_back" },
    { shape = "loop" },
]
road_cost = 7.0
look = {}

[[canyonlands_ut.sections]]
heading = "Every wall throws its shadow"
crop_center_m = [601913, 4254304]
crop_in = [6, 4.5]
feature = "Shading"
variant = "poster"
crop_place = "Island in the Sky down to the White Rim, for the coin and its relief"

[[canyonlands_ut.sections]]
heading = "The river stays down in its canyon"
crop_center_m = [600901, 4229820]
crop_in = [6, 4.5]
feature = "Rivers"
variant = "poster"
crop_place = "the Confluence, looking into the inner gorge"

[[canyonlands_ut.sections]]
heading = "A slow drive bends with every side canyon"
crop_center_m = [589307, 4248977]
crop_in = [6, 4.5]
feature = "Your track"
variant = "poster"
crop_place = "a stretch of the White Rim Road around the heads of side canyons"

[tahoe_ca]
anchor = "tahoe"
name = "Lake Tahoe and Desolation"
